# Postgres 17 + PostGIS, built from docker/Dockerfile. Start: docker compose up -d
# After changing anything in docker/: docker compose up -d --build
name: tempradar

services:
  db:
    build: ./docker
    image: tempradar-db
    container_name: tempradar-db
    restart: unless-stopped

    # Values come from .env (copy .env.example).
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Role passwords, used once by docker/init/01_init.sh
      LOADER_PASSWORD: ${LOADER_PASSWORD}
      TRANSFORMER_PASSWORD: ${TRANSFORMER_PASSWORD}
      READER_PASSWORD: ${READER_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # set POSTGRES_PORT in .env if 5432 is taken

    # docker/init/01_init.sh is built into the image; it runs only on an empty
    # volume (start over: docker compose down -v)
    volumes:
      - pgdata:/var/lib/postgresql/data

    # Docker's 64 MB default is too small for parallel queries
    shm_size: 1gb

    # Memory settings; lower them on machines with less than 8 GB of RAM
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=3GB

    # -h 127.0.0.1: not ready until the setup script has finished
    # $$ = a literal $ for the container's shell
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
