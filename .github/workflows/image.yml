# Builds the database image from docker/ and publishes it to GitHub Container
# Registry, so CI runs on exactly the same Postgres, PostGIS and setup script.
name: Publish database image

on:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/image.yml"]
  workflow_dispatch:   # "Run workflow" button on the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # lets GITHUB_TOKEN push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: docker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tempradar-db:17-3.6
            ghcr.io/${{ github.repository_owner }}/tempradar-db:latest
