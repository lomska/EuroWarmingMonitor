version: 2

exposures:
  - name: tempradar_app
    label: TempRadar city climate app
    type: application
    maturity: low
    description: >
      Streamlit app: a clickable map of how the latest finished month (or
      year) compares with a climate normal, and for a searched place or a
      clicked grid cell its key numbers, warming trend and history. Reads the
      marts as the read-only reader role, or their Parquet export.
    depends_on:
      - ref('dim_city')
      - ref('dim_grid_point')
      - ref('mart_grid_history')
      - ref('mart_grid_latest_period')
      - ref('mart_grid_warming_trend')
      - ref('mart_grid_annual_warming_trend')
    owner:
      name: Tanya
