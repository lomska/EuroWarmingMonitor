version: 2

models:
  - name: stg_geonames__cities
    description: GeoNames places with typed columns. One row per place.
    columns:
      - name: city_id
        data_tests: [unique, not_null]
      - name: lat
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -90
                max_value: 90
      - name: lon
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -180
                max_value: 180
      - name: elevation_m
        description: Elevation reported for the place, in metres (often missing).
      - name: dem_elevation_m
        description: Elevation from a terrain model at the place, in metres.

  - name: stg_geonames__admin1
    columns:
      - name: admin1_key
        data_tests: [unique, not_null]

  - name: stg_geonames__countries
    columns:
      - name: country_code
        data_tests: [unique, not_null]
