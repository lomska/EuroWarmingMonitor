version: 2

# Every mart has an enforced contract: its columns and data types are fixed
# here, and a build fails if the SQL would produce anything different.

models:
  - name: dim_grid_point
    description: >
      One row per ERA5 grid point and the 0.25° square it represents.
      {{ doc('grid_squares') }}
    config:
      indexes:
        - columns: [grid_point_id]
          unique: true
      contract:
        enforced: true
    columns:
      - name: grid_point_id
        description: Grid point id from its coordinates in hundredths of a degree, e.g. 4225_4275.
        data_type: text
        constraints:
          - type: not_null
        data_tests: [unique]
      - name: lat
        description: Latitude of the grid point (the square's centre), degrees north.
        data_type: double precision
      - name: lon
        description: Longitude of the grid point (the square's centre), degrees east.
        data_type: double precision
      - name: land_fraction
        description: Share of the square that is land (0 = sea, 1 = land).
        data_type: double precision
      - name: is_land
        description: True when land_fraction is at least 0.5.
        data_type: boolean
      - name: geom
        description: The grid point as a PostGIS point (SRID 4326).
        data_type: geometry
      - name: square
        description: The square as a PostGIS polygon (SRID 4326), for the map.
        data_type: geometry
      - name: area_km2
        description: Area of the square in km², measured on the sphere.
        data_type: double precision
        data_tests: [not_null]

  - name: dim_city
    description: >
      Places in the study area that the app can search, each with its grid square.
      {{ doc('city_to_square') }}
    config:
      indexes:
        - columns: [city_id]
          unique: true
        - columns: [grid_point_id]
      contract:
        enforced: true
    columns:
      - name: city_id
        description: GeoNames id.
        data_type: bigint
        constraints:
          - type: not_null
        data_tests: [unique]
      - name: city_name
        description: Name as used locally, in Latin script where GeoNames has one.
        data_type: text
      - name: ascii_name
        description: Name in plain ASCII characters.
        data_type: text
      - name: alternate_names
        description: Other names and spellings, comma-separated (searched by the app).
        data_type: text
      - name: display_name
        description: Name, region and country for search results, e.g. "Kutaisi, Imereti, Georgia".
        data_type: text
        data_tests: [not_null]
      - name: country_code
        description: ISO 3166 two-letter country code.
        data_type: text
      - name: country_name
        data_type: text
      - name: admin1_name
        description: First-level region, e.g. Imereti.
        data_type: text
      - name: lat
        description: Latitude of the place, degrees north.
        data_type: double precision
      - name: lon
        description: Longitude of the place, degrees east.
        data_type: double precision
      - name: population
        data_type: bigint
      - name: elevation_m
        description: Elevation of the place in metres (reported, else from a terrain model).
        data_type: integer
      - name: grid_point_id
        description: The grid square the place lies in.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_grid_point')
                field: grid_point_id
      - name: distance_to_grid_point_km
        description: Distance from the place to the centre of its square, in km.
        data_type: double precision

  - name: fct_grid_monthly_temp
    description: >
      Monthly mean 2 m air temperature per grid square, in °C. Incremental.
      {{ doc('preliminary') }}
    config:
      indexes:
        - columns: [grid_point_id, valid_month]
          unique: true
        - columns: [source_loaded_at]
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, valid_month]
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_era5__t2m_monthly')
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_grid_point')
                field: grid_point_id
      - name: valid_month
        description: First day of the month.
        data_type: date
        constraints:
          - type: not_null
      - name: year
        data_type: integer
      - name: month
        data_type: integer
      - name: temp_c
        description: Monthly mean 2 m air temperature in °C.
        data_type: double precision
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -90
                max_value: 60
      - name: is_preliminary
        description: True for preliminary ERA5T values, which may still be revised.
        data_type: boolean
      - name: source_loaded_at
        description: When the raw row was loaded; drives incremental runs.
        data_type: timestamp with time zone

  - name: fct_grid_normals
    description: >
      Climate normals per grid square and calendar month, and the change
      between the two periods. {{ doc('climate_normals') }}
    config:
      indexes:
        - columns: [grid_point_id, month]
          unique: true
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, month]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
      - name: month
        description: Calendar month, 1-12.
        data_type: integer
        constraints:
          - type: not_null
      - name: normal_c
        description: Mean temperature over the current baseline (default 1991-2020), °C.
        data_type: double precision
        data_tests: [not_null]
      - name: early_normal_c
        description: Mean temperature over the earlier baseline (default 1961-1990), °C.
        data_type: double precision
        data_tests: [not_null]
      - name: change_c
        description: normal_c minus early_normal_c; positive = warmer now.
        data_type: double precision

  - name: fct_grid_rolling_10y
    description: "{{ doc('rolling_window') }}"
    config:
      indexes:
        - columns: [grid_point_id, month, window_end_year]
          unique: true
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, month, window_end_year]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
      - name: month
        description: Calendar month, 1-12.
        data_type: integer
      - name: window_start_year
        data_type: integer
      - name: window_end_year
        description: Last year in the window; the value's label.
        data_type: integer
      - name: avg_temp_c
        description: Mean temperature over the window, °C.
        data_type: double precision
        data_tests: [not_null]
      - name: is_preliminary
        description: True if any month in the window is preliminary.
        data_type: boolean

  - name: fct_grid_anomaly
    description: >
      Each month's temperature minus the grid square's 1991-2020 normal for that
      calendar month. Positive = warmer than normal.
    config:
      indexes:
        - columns: [grid_point_id, valid_month]
          unique: true
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, valid_month]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
      - name: valid_month
        data_type: date
      - name: year
        data_type: integer
      - name: month
        data_type: integer
      - name: temp_c
        data_type: double precision
      - name: normal_c
        data_type: double precision
      - name: anomaly_c
        description: Difference from normal in °C.
        data_type: double precision
        data_tests: [not_null]
      - name: is_preliminary
        data_type: boolean

  - name: mart_grid_warming_trend
    description: >
      Linear warming trend per grid square and calendar month over the whole
      record, in °C per decade.
    config:
      indexes:
        - columns: [grid_point_id, month]
          unique: true
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, month]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
      - name: month
        data_type: integer
      - name: warming_c_per_decade
        description: Least-squares slope of temperature against year, times 10.
        data_type: double precision
        data_tests: [not_null]
      - name: r_squared
        description: Share of year-to-year variation explained by the trend (0 to 1).
        data_type: double precision
      - name: n_years
        description: Number of years the trend is fitted on.
        data_type: bigint
      - name: first_year
        data_type: integer
      - name: last_year
        data_type: integer

  - name: fct_grid_annual_temp
    description: "{{ doc('annual_mean') }}"
    config:
      indexes:
        - columns: [grid_point_id, year]
          unique: true
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, year]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_grid_point')
                field: grid_point_id
      - name: year
        data_type: integer
        constraints:
          - type: not_null
      - name: temp_c
        description: Annual mean 2 m air temperature, °C (months weighted by days).
        data_type: double precision
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -60
                max_value: 40
      - name: is_preliminary
        description: True if any month of the year is preliminary.
        data_type: boolean

  - name: fct_grid_rolling_10y_annual
    description: >
      Rolling mean of annual temperatures per grid square over `window_years`
      years (default 10), labelled by the window's end year: the 1949 value is
      the mean of the years 1940-1949. Complete windows only.
    config:
      indexes:
        - columns: [grid_point_id, window_end_year]
          unique: true
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, window_end_year]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
      - name: window_start_year
        data_type: integer
      - name: window_end_year
        description: Last year in the window; the value's label.
        data_type: integer
      - name: avg_temp_c
        description: Mean annual temperature over the window, °C.
        data_type: double precision
        data_tests: [not_null]
      - name: is_preliminary
        description: True if any month in the window is preliminary.
        data_type: boolean

  - name: fct_grid_annual_normals
    description: >
      Annual climate normals per grid square: the mean annual temperature over
      the current and the earlier baseline, and the change between them.
      {{ doc('climate_normals') }}
    config:
      indexes:
        - columns: [grid_point_id]
          unique: true
      contract:
        enforced: true
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('dim_grid_point')
                field: grid_point_id
      - name: normal_c
        description: Mean annual temperature over the current baseline (default 1991-2020), °C.
        data_type: double precision
        data_tests: [not_null]
      - name: early_normal_c
        description: Mean annual temperature over the earlier baseline (default 1961-1990), °C.
        data_type: double precision
        data_tests: [not_null]
      - name: change_c
        description: normal_c minus early_normal_c; positive = warmer now.
        data_type: double precision

  - name: mart_grid_annual_warming_trend
    description: >
      Linear warming trend of the annual mean temperature per grid square over
      all complete years, in °C per decade.
    config:
      indexes:
        - columns: [grid_point_id]
          unique: true
      contract:
        enforced: true
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('dim_grid_point')
                field: grid_point_id
      - name: warming_c_per_decade
        description: Least-squares slope of annual temperature against year, times 10.
        data_type: double precision
        data_tests: [not_null]
      - name: r_squared
        description: Share of year-to-year variation explained by the trend (0 to 1).
        data_type: double precision
      - name: n_years
        description: Number of complete years the trend is fitted on.
        data_type: bigint
      - name: first_year
        data_type: integer
      - name: last_year
        data_type: integer

unit_tests:
  - name: rolling_window_keeps_only_complete_windows
    description: >
      With a 3-year window, five Januaries give three windows with the right
      means; a grid point with only two years gives none; a preliminary month
      marks every window it falls in.
    model: fct_grid_rolling_10y
    overrides:
      vars:
        window_years: 3
    given:
      - input: ref('fct_grid_monthly_temp')
        rows:
          - {grid_point_id: a, year: 2000, month: 1, temp_c: 1.0, is_preliminary: false}
          - {grid_point_id: a, year: 2001, month: 1, temp_c: 2.0, is_preliminary: false}
          - {grid_point_id: a, year: 2002, month: 1, temp_c: 3.0, is_preliminary: false}
          - {grid_point_id: a, year: 2003, month: 1, temp_c: 4.0, is_preliminary: false}
          - {grid_point_id: a, year: 2004, month: 1, temp_c: 5.0, is_preliminary: true}
          - {grid_point_id: b, year: 2000, month: 7, temp_c: 20.0, is_preliminary: false}
          - {grid_point_id: b, year: 2001, month: 7, temp_c: 21.0, is_preliminary: false}
    expect:
      rows:
        - {grid_point_id: a, month: 1, window_start_year: 2000, window_end_year: 2002, avg_temp_c: 2.0, is_preliminary: false}
        - {grid_point_id: a, month: 1, window_start_year: 2001, window_end_year: 2003, avg_temp_c: 3.0, is_preliminary: false}
        - {grid_point_id: a, month: 1, window_start_year: 2002, window_end_year: 2004, avg_temp_c: 4.0, is_preliminary: true}

  - name: annual_mean_weights_months_by_days_and_needs_12_months
    description: >
      In 2001, January is 365 °C and every other month 0 °C. Weighted by days,
      the annual mean is 365 x 31 / 365 = 31.0 (a plain average of the 12 months
      would give 30.4). 2002 has only one month and is left out.
    model: fct_grid_annual_temp
    given:
      - input: ref('fct_grid_monthly_temp')
        rows:
          - {grid_point_id: 'p', valid_month: '2001-01-01', year: 2001, month: 1, temp_c: 365.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-02-01', year: 2001, month: 2, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-03-01', year: 2001, month: 3, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-04-01', year: 2001, month: 4, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-05-01', year: 2001, month: 5, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-06-01', year: 2001, month: 6, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-07-01', year: 2001, month: 7, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-08-01', year: 2001, month: 8, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-09-01', year: 2001, month: 9, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-10-01', year: 2001, month: 10, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-11-01', year: 2001, month: 11, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-12-01', year: 2001, month: 12, temp_c: 0.0, is_preliminary: true}
          - {grid_point_id: 'p', valid_month: '2002-01-01', year: 2002, month: 1, temp_c: 5.0, is_preliminary: false}
    expect:
      rows:
        - {grid_point_id: 'p', year: 2001, temp_c: 31.0, is_preliminary: true}
