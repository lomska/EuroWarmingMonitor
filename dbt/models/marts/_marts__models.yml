version: 2

# Every mart has an enforced contract: its columns and data types are fixed
# here, and a build fails if the SQL would produce anything different.

models:
  - name: dim_grid_point
    description: >
      One row per ERA5 grid point and the 0.25° square it represents.
      {{ doc('grid_squares') }}
    config:
      indexes:
        - columns: [grid_point_id]
          unique: true
      contract:
        enforced: true
    columns:
      - name: grid_point_id
        description: Grid point id from its coordinates in hundredths of a degree, e.g. 4225_4275.
        data_type: text
        constraints:
          - type: not_null
        data_tests: [unique]
      - name: lat
        description: Latitude of the grid point (the square's centre), degrees north.
        data_type: double precision
      - name: lon
        description: Longitude of the grid point (the square's centre), degrees east.
        data_type: double precision
      - name: land_fraction
        description: Share of the square that is land (0 = sea, 1 = land).
        data_type: double precision
      - name: is_land
        description: True when land_fraction is at least 0.5.
        data_type: boolean
      - name: geom
        description: The grid point as a PostGIS point (SRID 4326).
        data_type: geometry
      - name: square
        description: The square as a PostGIS polygon (SRID 4326), for the map.
        data_type: geometry
      - name: area_km2
        description: Area of the square in km², measured on the sphere.
        data_type: double precision
        data_tests: [not_null]

  - name: dim_city
    description: >
      Places in the study area that the app can search, each with its grid square.
      {{ doc('city_to_square') }}
    config:
      indexes:
        - columns: [city_id]
          unique: true
        - columns: [grid_point_id]
      contract:
        enforced: true
    columns:
      - name: city_id
        description: GeoNames id.
        data_type: bigint
        constraints:
          - type: not_null
        data_tests: [unique]
      - name: city_name
        description: Name as used locally, in Latin script where GeoNames has one.
        data_type: text
      - name: ascii_name
        description: Name in plain ASCII characters.
        data_type: text
      - name: alternate_names
        description: Other names and spellings, comma-separated (searched by the app).
        data_type: text
      - name: display_name
        description: Name, region and country for search results, e.g. "Kutaisi, Imereti, Georgia".
        data_type: text
        data_tests: [not_null]
      - name: country_code
        description: ISO 3166 two-letter country code.
        data_type: text
      - name: country_name
        data_type: text
      - name: admin1_name
        description: First-level region, e.g. Imereti.
        data_type: text
      - name: lat
        description: Latitude of the place, degrees north.
        data_type: double precision
      - name: lon
        description: Longitude of the place, degrees east.
        data_type: double precision
      - name: population
        data_type: bigint
      - name: elevation_m
        description: Elevation of the place in metres (reported, else from a terrain model).
        data_type: integer
      - name: grid_point_id
        description: The grid square the place lies in.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_grid_point')
                field: grid_point_id
      - name: distance_to_grid_point_km
        description: Distance from the place to the centre of its square, in km.
        data_type: double precision

  - name: fct_grid_monthly_temp
    description: >
      Monthly mean 2 m air temperature per grid square, in °C. Incremental.
      {{ doc('preliminary') }}
    config:
      indexes:
        - columns: [grid_point_id, valid_month]
          unique: true
        - columns: [source_loaded_at]
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, valid_month]
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_era5__t2m_monthly')
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_grid_point')
                field: grid_point_id
      - name: valid_month
        description: First day of the month.
        data_type: date
        constraints:
          - type: not_null
      - name: year
        data_type: integer
      - name: month
        data_type: integer
      - name: temp_c
        description: Monthly mean 2 m air temperature in °C.
        data_type: double precision
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -90
                max_value: 60
      - name: is_preliminary
        description: True for preliminary ERA5T values, which may still be revised.
        data_type: boolean
      - name: source_loaded_at
        description: When the raw row was loaded; drives incremental runs.
        data_type: timestamp with time zone

  - name: fct_grid_normals
    description: >
      Climate normals per grid square and calendar month, and the change
      between the two periods. {{ doc('climate_normals') }}
    config:
      indexes:
        - columns: [grid_point_id, month]
          unique: true
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, month]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
      - name: month
        description: Calendar month, 1-12.
        data_type: integer
        constraints:
          - type: not_null
      - name: normal_c
        description: Mean temperature over the current baseline (default 1991-2020), °C.
        data_type: double precision
        data_tests: [not_null]
      - name: early_normal_c
        description: Mean temperature over the earlier baseline (default 1961-1990), °C.
        data_type: double precision
        data_tests: [not_null]
      - name: change_c
        description: normal_c minus early_normal_c; positive = warmer now.
        data_type: double precision

  - name: fct_grid_rolling_10y
    description: "{{ doc('rolling_window') }}"
    config:
      indexes:
        - columns: [grid_point_id, month, window_end_year]
          unique: true
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, month, window_end_year]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
      - name: month
        description: Calendar month, 1-12.
        data_type: integer
      - name: window_start_year
        data_type: integer
      - name: window_end_year
        description: Last year in the window; the value's label.
        data_type: integer
      - name: avg_temp_c
        description: Mean temperature over the window, °C.
        data_type: double precision
        data_tests: [not_null]
      - name: is_preliminary
        description: True if any month in the window is preliminary.
        data_type: boolean

  - name: mart_grid_warming_trend
    description: >
      Linear warming trend per grid square and calendar month over the whole
      record, in °C per decade.
    config:
      indexes:
        - columns: [grid_point_id, month]
          unique: true
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, month]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
      - name: month
        data_type: integer
      - name: warming_c_per_decade
        description: Least-squares slope of temperature against year, times 10.
        data_type: double precision
        data_tests: [not_null]
      - name: r_squared
        description: Share of year-to-year variation explained by the trend (0 to 1).
        data_type: double precision
      - name: n_years
        description: Number of years the trend is fitted on.
        data_type: bigint
      - name: first_year
        data_type: integer
      - name: last_year
        data_type: integer

  - name: fct_grid_annual_temp
    description: "{{ doc('annual_mean') }}"
    config:
      indexes:
        - columns: [grid_point_id, year]
          unique: true
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, year]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_grid_point')
                field: grid_point_id
      - name: year
        data_type: integer
        constraints:
          - type: not_null
      - name: temp_c
        description: Annual mean 2 m air temperature, °C (months weighted by days).
        data_type: double precision
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -60
                max_value: 40
      - name: is_preliminary
        description: True if any month of the year is preliminary.
        data_type: boolean

  - name: fct_grid_rolling_10y_annual
    description: >
      Rolling mean of annual temperatures per grid square over `window_years`
      years (default 10), labelled by the window's end year: the 1949 value is
      the mean of the years 1940-1949. Complete windows only.
    config:
      indexes:
        - columns: [grid_point_id, window_end_year]
          unique: true
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, window_end_year]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
      - name: window_start_year
        data_type: integer
      - name: window_end_year
        description: Last year in the window; the value's label.
        data_type: integer
      - name: avg_temp_c
        description: Mean annual temperature over the window, °C.
        data_type: double precision
        data_tests: [not_null]
      - name: is_preliminary
        description: True if any month in the window is preliminary.
        data_type: boolean

  - name: fct_grid_annual_normals
    description: >
      Annual climate normals per grid square: the mean annual temperature over
      the current and the earlier baseline, and the change between them.
      {{ doc('climate_normals') }}
    config:
      indexes:
        - columns: [grid_point_id]
          unique: true
      contract:
        enforced: true
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('dim_grid_point')
                field: grid_point_id
      - name: normal_c
        description: Mean annual temperature over the current baseline (default 1991-2020), °C.
        data_type: double precision
        data_tests: [not_null]
      - name: early_normal_c
        description: Mean annual temperature over the earlier baseline (default 1961-1990), °C.
        data_type: double precision
        data_tests: [not_null]
      - name: change_c
        description: normal_c minus early_normal_c; positive = warmer now.
        data_type: double precision

  - name: mart_grid_annual_warming_trend
    description: >
      Linear warming trend of the annual mean temperature per grid square over
      all complete years, in °C per decade.
    config:
      indexes:
        - columns: [grid_point_id]
          unique: true
      contract:
        enforced: true
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('dim_grid_point')
                field: grid_point_id
      - name: warming_c_per_decade
        description: Least-squares slope of annual temperature against year, times 10.
        data_type: double precision
        data_tests: [not_null]
      - name: r_squared
        description: Share of year-to-year variation explained by the trend (0 to 1).
        data_type: double precision
      - name: n_years
        description: Number of complete years the trend is fitted on.
        data_type: bigint
      - name: first_year
        data_type: integer
      - name: last_year
        data_type: integer

  - name: mart_grid_latest_period
    description: >
      The latest finished occurrence of each calendar month (month 1-12) and
      the latest complete year (month 0) per grid square: its temperature, and
      how it compares with both climate normals and with the same period a year
      earlier. In October 2026, September is 2026 but October is 2025.
      Feeds the app's map and key numbers. {{ doc('climate_normals') }}
    config:
      indexes:
        - columns: [grid_point_id, month]
          unique: true
        - columns: [month]
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grid_point_id, month]
    columns:
      - name: grid_point_id
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_grid_point')
                field: grid_point_id
      - name: month
        description: Calendar month 1-12, or 0 for the whole year.
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 12
      - name: year
        description: The year of this latest month, or the latest complete year.
        data_type: integer
        data_tests: [not_null]
      - name: temp_c
        description: Mean temperature of that month or year, °C.
        data_type: double precision
        data_tests: [not_null]
      - name: normal_c
        description: Mean over the current baseline (default 1991-2020), °C.
        data_type: double precision
      - name: early_normal_c
        description: Mean over the earlier baseline (default 1961-1990), °C.
        data_type: double precision
      - name: previous_year_temp_c
        description: The same month (or the whole year) one year earlier, °C.
        data_type: double precision
      - name: change_vs_normal_c
        description: temp_c minus normal_c.
        data_type: double precision
        data_tests: [not_null]
      - name: change_vs_early_normal_c
        description: temp_c minus early_normal_c.
        data_type: double precision
        data_tests: [not_null]
      - name: change_vs_previous_year_c
        description: temp_c minus previous_year_temp_c.
        data_type: double precision
      - name: is_preliminary
        description: True for preliminary ERA5T values. {{ doc('preliminary') }}
        data_type: boolean

  - name: mart_grid_history
    description: >
      Every single year per grid square, for each calendar month (month 1-12)
      and the whole year (month 0), with the rolling mean of the
      var('window_years') years ending that year. Feeds the app's history chart:
      the line and the warming stripes. A view over the indexed fct tables, so
      it takes no space and no build time; its columns are tested where they
      are made (fct_grid_monthly_temp, fct_grid_annual_temp and the rolling
      models), and the join by the unit test below. {{ doc('preliminary') }}
    config:
      materialized: view
      contract:
        enforced: true
    columns:
      - name: grid_point_id
        data_type: text
      - name: month
        description: Calendar month 1-12, or 0 for the whole year.
        data_type: integer
      - name: year
        data_type: integer
      - name: temp_c
        description: Mean temperature of that month or year, °C.
        data_type: double precision
      - name: is_preliminary
        description: True when temp_c uses preliminary ERA5T data.
        data_type: boolean
      - name: rolling_start_year
        description: First year of the rolling window that ends this year.
        data_type: integer
      - name: rolling_avg_c
        description: >
          Mean of the var('window_years') values ending this year, °C. Empty
          for the first years, before a complete window.
        data_type: double precision
      - name: rolling_is_preliminary
        description: True when any year in the window is preliminary.
        data_type: boolean

unit_tests:
  - name: rolling_window_keeps_only_complete_windows
    description: >
      With a 3-year window, five Januaries give three windows with the right
      means; a grid point with only two years gives none; a preliminary month
      marks every window it falls in.
    model: fct_grid_rolling_10y
    overrides:
      vars:
        window_years: 3
    given:
      - input: ref('fct_grid_monthly_temp')
        rows:
          - {grid_point_id: a, year: 2000, month: 1, temp_c: 1.0, is_preliminary: false}
          - {grid_point_id: a, year: 2001, month: 1, temp_c: 2.0, is_preliminary: false}
          - {grid_point_id: a, year: 2002, month: 1, temp_c: 3.0, is_preliminary: false}
          - {grid_point_id: a, year: 2003, month: 1, temp_c: 4.0, is_preliminary: false}
          - {grid_point_id: a, year: 2004, month: 1, temp_c: 5.0, is_preliminary: true}
          - {grid_point_id: b, year: 2000, month: 7, temp_c: 20.0, is_preliminary: false}
          - {grid_point_id: b, year: 2001, month: 7, temp_c: 21.0, is_preliminary: false}
    expect:
      rows:
        - {grid_point_id: a, month: 1, window_start_year: 2000, window_end_year: 2002, avg_temp_c: 2.0, is_preliminary: false}
        - {grid_point_id: a, month: 1, window_start_year: 2001, window_end_year: 2003, avg_temp_c: 3.0, is_preliminary: false}
        - {grid_point_id: a, month: 1, window_start_year: 2002, window_end_year: 2004, avg_temp_c: 4.0, is_preliminary: true}

  - name: annual_mean_weights_months_by_days_and_needs_12_months
    description: >
      In 2001, January is 365 °C and every other month 0 °C. Weighted by days,
      the annual mean is 365 x 31 / 365 = 31.0 (a plain average of the 12 months
      would give 30.4). 2002 has only one month and is left out.
    model: fct_grid_annual_temp
    given:
      - input: ref('fct_grid_monthly_temp')
        rows:
          - {grid_point_id: 'p', valid_month: '2001-01-01', year: 2001, month: 1, temp_c: 365.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-02-01', year: 2001, month: 2, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-03-01', year: 2001, month: 3, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-04-01', year: 2001, month: 4, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-05-01', year: 2001, month: 5, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-06-01', year: 2001, month: 6, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-07-01', year: 2001, month: 7, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-08-01', year: 2001, month: 8, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-09-01', year: 2001, month: 9, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-10-01', year: 2001, month: 10, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-11-01', year: 2001, month: 11, temp_c: 0.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2001-12-01', year: 2001, month: 12, temp_c: 0.0, is_preliminary: true}
          - {grid_point_id: 'p', valid_month: '2002-01-01', year: 2002, month: 1, temp_c: 5.0, is_preliminary: false}
    expect:
      rows:
        - {grid_point_id: 'p', year: 2001, temp_c: 31.0, is_preliminary: true}

  - name: history_joins_each_year_to_the_window_ending_then
    description: >
      Each single year gets the rolling mean of the window ending that year;
      the first year, with no complete window yet, gets none. The whole year
      comes as month 0 the same way.
    model: mart_grid_history
    given:
      - input: ref('fct_grid_monthly_temp')
        rows:
          - {grid_point_id: 'p', month: 9, year: 2025, temp_c: 20.0, is_preliminary: false}
          - {grid_point_id: 'p', month: 9, year: 2026, temp_c: 21.0, is_preliminary: true}
      - input: ref('fct_grid_rolling_10y')
        rows:
          - {grid_point_id: 'p', month: 9, window_end_year: 2026, avg_temp_c: 19.5, is_preliminary: true, window_start_year: 2017}
      - input: ref('fct_grid_annual_temp')
        rows:
          - {grid_point_id: 'p', year: 2025, temp_c: 11.0, is_preliminary: false}
      - input: ref('fct_grid_rolling_10y_annual')
        rows:
          - {grid_point_id: 'p', window_end_year: 2025, avg_temp_c: 10.4, is_preliminary: false, window_start_year: 2016}
    expect:
      rows:
        - {grid_point_id: 'p', month: 0, year: 2025, temp_c: 11.0, is_preliminary: false, rolling_start_year: 2016, rolling_avg_c: 10.4, rolling_is_preliminary: false}
        - {grid_point_id: 'p', month: 9, year: 2025, temp_c: 20.0, is_preliminary: false, rolling_start_year: null, rolling_avg_c: null, rolling_is_preliminary: null}
        - {grid_point_id: 'p', month: 9, year: 2026, temp_c: 21.0, is_preliminary: true, rolling_start_year: 2017, rolling_avg_c: 19.5, rolling_is_preliminary: true}

  - name: latest_period_uses_each_months_latest_year
    description: >
      With data until September 2026, September is 2026 but October is 2025,
      the year is 2025, and each is compared with the year before.
    model: mart_grid_latest_period
    given:
      - input: ref('fct_grid_monthly_temp')
        rows:
          - {grid_point_id: 'p', valid_month: '2025-09-01', year: 2025, month: 9, temp_c: 20.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2025-10-01', year: 2025, month: 10, temp_c: 12.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2024-10-01', year: 2024, month: 10, temp_c: 11.0, is_preliminary: false}
          - {grid_point_id: 'p', valid_month: '2026-09-01', year: 2026, month: 9, temp_c: 21.5, is_preliminary: true}
      - input: ref('fct_grid_annual_temp')
        rows:
          - {grid_point_id: 'p', year: 2024, temp_c: 10.0, is_preliminary: false}
          - {grid_point_id: 'p', year: 2025, temp_c: 10.5, is_preliminary: false}
      - input: ref('fct_grid_normals')
        rows:
          - {grid_point_id: 'p', month: 9, normal_c: 20.0, early_normal_c: 19.0}
          - {grid_point_id: 'p', month: 10, normal_c: 11.5, early_normal_c: 11.0}
      - input: ref('fct_grid_annual_normals')
        rows:
          - {grid_point_id: 'p', normal_c: 9.5, early_normal_c: 9.0}
    expect:
      rows:
        - {grid_point_id: 'p', month: 0, year: 2025, change_vs_normal_c: 1.0, change_vs_early_normal_c: 1.5, change_vs_previous_year_c: 0.5}
        - {grid_point_id: 'p', month: 9, year: 2026, change_vs_normal_c: 1.5, change_vs_early_normal_c: 2.5, change_vs_previous_year_c: 1.5}
        - {grid_point_id: 'p', month: 10, year: 2025, change_vs_normal_c: 0.5, change_vs_early_normal_c: 1.0, change_vs_previous_year_c: 1.0}
