# Run dbt from this folder: dotenv -f ../.env run -- dbt build

name: tempradar
version: "1.0.0"
config-version: 2

profile: tempradar   # connection settings: profiles.yml in this folder

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

# Changing grid_step_deg or window_years needs: dbt build --full-refresh
vars:
  grid_step_deg: 0.25        # ERA5 grid spacing; must match era5.grid in config/pipeline.yml
  window_years: 10           # length of the rolling window
  baseline_start: 1991       # current WMO climate normal, used for anomalies
  baseline_end: 2020
  early_baseline_start: 1961 # earlier normal, to show long-term change
  early_baseline_end: 1990

# One Postgres schema per layer (see macros/generate_schema_name.sql)
models:
  tempradar:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  tempradar:
    +schema: marts

data_tests:
  tempradar:
    +store_failures: false
