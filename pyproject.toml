# Tool settings. Python dependencies are in requirements.txt and requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/dbt_packages"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Modules imported by the scripts next to them: load/common.py, app/charts.py, app/data.py
known-first-party = ["common", "charts", "data"]
